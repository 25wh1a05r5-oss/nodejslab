<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <h2 class="text-center mb-4">
                Registration
            </h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           placeholder="Enter password">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input type="tel"
                           class="form-control"
                           placeholder="Enter mobile number">
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Register
                </button>

            </form>

        </div>

    </div>

</div>
