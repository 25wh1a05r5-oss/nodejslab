<!-- ================= REGISTRATION ================= -->

<div class="container my-5">


<div class="row justify-content-center">

    <div class="col-12 col-md-10 col-lg-8">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>


                <form>


                    <!-- Name -->

                    <div class="row">

                        <div class="col-12 col-md-6 mb-3">

                            <label for="firstName"
                                   class="form-label">

                                First Name

                            </label>

                            <input type="text"
                                   id="firstName"
                                   class="form-control"
                                   placeholder="Enter first name"
                                   required>

                        </div>


                        <div class="col-12 col-md-6 mb-3">

                            <label for="lastName"
                                   class="form-label">

                                Last Name

                            </label>

                            <input type="text"
                                   id="lastName"
                                   class="form-control"
                                   placeholder="Enter last name"
                                   required>

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label for="email"
                               class="form-label">

                            Email Address

                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Enter email"
                               required>

                    </div>


                    <!-- Mobile -->

                    <div class="mb-3">

                        <label for="mobile"
                               class="form-label">

                            Mobile Number

                        </label>

                        <input type="tel"
                               id="mobile"
                               class="form-control"
                               placeholder="Enter mobile number"
                               required>

                    </div>


                    <!-- Gender -->

                    <div class="mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="male"
                                       value="male">

                                <label class="form-check-label"
                                       for="male">

                                    Male

                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="female"
                                       value="female">

                                <label class="form-check-label"
                                       for="female">

                                    Female

                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="other"
                                       value="other">

                                <label class="form-check-label"
                                       for="other">

                                    Other

                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- Date of Birth -->

                    <div class="mb-3">

                        <label for="dob"
                               class="form-label">

                            Date of Birth

                        </label>

                        <input type="date"
                               id="dob"
                               class="form-control">

                    </div>


                    <!-- Course -->

                    <div class="mb-3">

                        <label for="course"
                               class="form-label">

                            Course

                        </label>

                        <select id="course"
                                class="form-select">

                            <option selected>
                                Select Course
                            </option>

                            <option>
                                B.Tech
                            </option>

                            <option>
                                M.Tech
                            </option>

                            <option>
                                MCA
                            </option>

                            <option>
                                MBA
                            </option>

                        </select>

                    </div>


                    <!-- Password -->

                    <div class="row">

                        <div class="col-12 col-md-6 mb-3">

                            <label for="password"
                                   class="form-label">

                                Password

                            </label>

                            <input type="password"
                                   id="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>

                        </div>


                        <div class="col-12 col-md-6 mb-3">

                            <label for="confirmPassword"
                                   class="form-label">

                                Confirm Password

                            </label>

                            <input type="password"
                                   id="confirmPassword"
                                   class="form-control"
                                   placeholder="Confirm password"
                                   required>

                        </div>

                    </div>


                    <!-- Terms -->

                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               id="terms"
                               required>

                        <label class="form-check-label"
                               for="terms">

                            I agree to the terms and conditions.

                        </label>

                    </div>


                    <!-- Submit -->

                    <button type="submit"
                            class="btn btn-success w-100">

                        Register

                    </button>


                </form>


                <p class="text-center mt-3">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>
